name: bbw-demo
services:
  users:
    image: bbw-users:local
    build: ../bbw-users
    environment:
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
    ports: ["127.0.0.1:3001:3001"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
  catalog:
    image: bbw-catalog:local
    build: ../bbw-catalog
    environment:
      PORT: 3002
      CORS_ORIGIN: http://localhost:3000
    ports: ["127.0.0.1:3002:3002"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3002/health"]
      interval: 5s
      timeout: 3s
      retries: 10
  checkout:
    image: bbw-checkout:local
    build: ../bbw-checkout
    environment:
      PORT: 3003
      CORS_ORIGIN: http://localhost:3000
      USERS_URL: http://users:3001
      CATALOG_URL: http://catalog:3002
      DEPENDENCY_TIMEOUT_MS: 2000
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-bbw-demo}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      DEMO_SCENARIO: ${DEMO_SCENARIO:-CHK-001}
      DEMO_RUN_ID: ${DEMO_RUN_ID:-ensaio-001}
    ports: ["127.0.0.1:3003:3003"]
    depends_on:
      users: { condition: service_healthy }
      catalog: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
  storefront:
    image: bbw-storefront:local
    build: .
    ports: ["127.0.0.1:3000:80"]
    depends_on:
      checkout: { condition: service_healthy }
