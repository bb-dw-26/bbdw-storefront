name: bbdw-demo
services:
  catalog:
    image: bbdw-catalog:local
    build: ../bbdw-catalog
    environment:
      SENTRY_DSN: ${CATALOG_SENTRY_DSN:-}
      SENTRY_RELEASE: ${CATALOG_SENTRY_RELEASE:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-bbdw-local}
      DEMO_SCENARIO: none
      DEMO_RUN_ID: ${DEMO_RUN_ID:-local}
      PORT: 3002
      CORS_ORIGIN: http://localhost:3000
    ports: ["127.0.0.1:3002:3002"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3002/health"]
      interval: 5s
      timeout: 3s
      retries: 10
  checkout:
    image: bbdw-checkout:local
    build: ../bbdw-checkout
    environment:
      PORT: 3003
      CORS_ORIGIN: http://localhost:3000
      CATALOG_URL: http://catalog:3002
      DEPENDENCY_TIMEOUT_MS: 2000
      VIACEP_BASE_URL: https://viacep.com.br/ws
      CHECKOUT_DEMO_DELAY_MS: ${CHECKOUT_DEMO_DELAY_MS:-0}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-bbdw-demo}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      DEMO_SCENARIO: ${DEMO_SCENARIO:-none}
      DEMO_RUN_ID: ${DEMO_RUN_ID:-ensaio-001}
    ports: ["127.0.0.1:3003:3003"]
    depends_on:
      catalog: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
  storefront:
    image: bbdw-storefront:local
    build:
      context: .
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-bbdw-local}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
        VITE_DEMO_SCENARIO: ${VITE_DEMO_SCENARIO:-none}
        VITE_DEMO_RUN_ID: ${VITE_DEMO_RUN_ID:-local}
    ports: ["127.0.0.1:3000:80"]
    depends_on:
      checkout: { condition: service_healthy }
